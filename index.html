    * { box-sizing: border-box; }

    /* Loading screen */

  <script>
    // =============================================================
    //  SUPABASE CONFIGURATION
    //  ⬇️ Paste your Supabase project URL and anon key below ⬇️
    // =============================================================
    const SUPABASE_URL = 'https://vipnubhujyfbfujdgchj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_15vFo2GC3m_CJD0-Oou0pQ_RiipId-l';

    // Initialize Supabase client (safely — CDN may fail to load)
    // NOTE: Variable named 'db' to avoid shadowing window.supabase (the CDN library)
    let db = null;
    try {
      if (window.supabase && window.supabase.createClient && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.warn('Supabase init failed:', e);
    }

    // ===== STATE =====
    const state = {
      userLat: null,
      userLon: null,
      mosques: [],        // Processed OSM mosques merged with Supabase reports
      reports: [],        // Raw Supabase jamaat_reports
      reportsMap: {},     // osm_node_id -> report object (for fast lookup)
      map: null,
      markersLayer: null,
      activeView: 'feed',
      usingDefault: false,
    };

    // ===== CONSTANTS =====
    const DEFAULT_LAT = 23.7276;
    const DEFAULT_LON = 90.3854;
    const SEARCH_RADIUS = 5000; // meters

    // ===== HAVERSINE =====
    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ===== TOAST =====
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        info: 'bg-gray-800 text-white',
        success: 'bg-emerald-700 text-white',
        warning: 'bg-amber-600 text-white',
        error: 'bg-red-600 text-white',
      };
      const toast = document.createElement('div');
      toast.className = `toast ${colors[type]} px-5 py-3 rounded-xl shadow-lg text-sm font-medium pointer-events-auto max-w-sm text-center`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4200);
    }

    // ===== GEOLOCATION =====
    function getUserLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ lat: DEFAULT_LAT, lon: DEFAULT_LON, fallback: true });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, fallback: false }),
          () => resolve({ lat: DEFAULT_LAT, lon: DEFAULT_LON, fallback: true }),
          { timeout: 8000, enableHighAccuracy: true, maximumAge: 60000 }
        );
      });
    }

    // ===============================================================
    //  OVERPASS API — Fetch nearby mosques (radius-based, fast)
    // ===============================================================
    async function fetchMosquesFromOSM(lat, lon) {
      const query = `
        [out:json][timeout:25];
        (
          node["amenity"="place_of_worship"]["religion"="muslim"](around:${SEARCH_RADIUS},${lat},${lon});
          way["amenity"="place_of_worship"]["religion"="muslim"](around:${SEARCH_RADIUS},${lat},${lon});
        );
        out center body;
      `;
      const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

      try {
        const loadingText = document.getElementById('loading-text');
        if (loadingText) loadingText.textContent = 'Finding nearby mosques...';

        // Abort fetch after 20 seconds to prevent infinite hang
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 20000);

        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error('Overpass API error');
        const data = await res.json();
        const elements = (data.elements || []).map(el => {
          if (el.type === 'way' && el.center) {
            el.lat = el.center.lat;
            el.lon = el.center.lon;
          }
          return el;
        }).filter(el => el.lat && el.lon);
        return elements;
      } catch (err) {
        console.error('Overpass fetch failed:', err);
        showToast('Could not fetch mosque data. Showing cached results.', 'warning');
        return generateFallbackMosques(lat, lon);
      }
    }

    // Fallback mosques if API fails — real Dhaka mosques with actual coordinates
    function generateFallbackMosques(lat, lon) {
      const mosques = [
        { name: 'বায়তুল মুকাররম জাতীয় মসজিদ', lat: 23.7285, lon: 90.4109 },
        { name: 'আজিমপুর জামে মসজিদ', lat: 23.7275, lon: 90.3845 },
        { name: 'লালবাগ কেল্লা মসজিদ', lat: 23.7190, lon: 90.3886 },
        { name: 'ধানমন্ডি জামে মসজিদ', lat: 23.7462, lon: 90.3723 },
        { name: 'গুলশান কেন্দ্রীয় মসজিদ', lat: 23.7918, lon: 90.4154 },
        { name: 'মিরপুর শাহ আলী মসজিদ', lat: 23.8042, lon: 90.3685 },
        { name: 'উত্তরা মডেল জামে মসজিদ', lat: 23.8736, lon: 90.3990 },
        { name: 'ঢাকা বিশ্ববিদ্যালয় কেন্দ্রীয় মসজিদ', lat: 23.7331, lon: 90.3930 },
        { name: 'তারা মসজিদ (পুরান ঢাকা)', lat: 23.7088, lon: 90.3994 },
        { name: 'হাতিরপুল জামে মসজিদ', lat: 23.7393, lon: 90.3921 },
        { name: 'কাকরাইল মসজিদ', lat: 23.7378, lon: 90.4089 },
        { name: 'চকবাজার শাহী মসজিদ', lat: 23.7164, lon: 90.4011 },
        { name: 'মোহাম্মদপুর জামে মসজিদ', lat: 23.7657, lon: 90.3586 },
        { name: 'BCSIR Central Mosque', lat: 23.7291, lon: 90.3843 },
        { name: 'নিউমার্কেট জামে মসজিদ', lat: 23.7334, lon: 90.3842 },
      ];
      return mosques.map((m, i) => ({
        type: 'node',
        id: 9000 + i,
        lat: m.lat,
        lon: m.lon,
        tags: { name: m.name, amenity: 'place_of_worship', religion: 'muslim' }
      }));
    }

    // ===============================================================
    //  SUPABASE — Fetch all jamaat_reports
    // ===============================================================
    async function fetchReportsFromSupabase() {
      if (!db) return []; // Supabase not initialized
      try {
        const { data, error } = await db
          .from('jamaat_reports')
          .select('*');
        if (error) throw error;
        return data || [];
      } catch (err) {
        console.error('Supabase fetch failed:', err);
        return [];
      }
    }

    // ===============================================================
    //  MERGE — Cross-reference OSM data with Supabase reports
    // ===============================================================
    function mergeDataAndProcess(rawOsmElements, reports, userLat, userLon) {
      // Build a lookup: osm_node_id -> report
      const reportsMap = {};
      reports.forEach(r => {
        const key = String(r.osm_node_id);
        // If multiple reports for same mosque, keep the most recent one
        if (!reportsMap[key] || new Date(r.created_at) > new Date(reportsMap[key].created_at)) {
          reportsMap[key] = r;
        }
      });
      state.reportsMap = reportsMap;

      return rawOsmElements
        .map((el) => {
          const osmId = String(el.id);
          const name = el.tags?.name || 'Local Mosque';
          const dist = haversine(userLat, userLon, el.lat, el.lon);
          const report = reportsMap[osmId] || null;

          // Format time elapsed from created_at
          let timeAgo = '';
          if (report && report.created_at) {
            const diffMs = Date.now() - new Date(report.created_at).getTime();
            const mins = Math.floor(diffMs / 60000);
            if (mins < 60) timeAgo = `${mins} mins ago`;
            else if (mins < 1440) timeAgo = `${Math.floor(mins / 60)}h ago`;
            else timeAgo = `${Math.floor(mins / 1440)}d ago`;
          }

          // Format jamaat_time for display (24h "HH:MM" -> "H:MM AM/PM")
          let displayTime = null;
          if (report && report.jamaat_time) {
            const parts = report.jamaat_time.split(':');
            if (parts.length >= 2) {
              let h = parseInt(parts[0], 10);
              const m = parts[1].padStart(2, '0');
              const ampm = h >= 12 ? 'PM' : 'AM';
              if (h > 12) h -= 12;
              if (h === 0) h = 12;
              displayTime = `${h}:${m} ${ampm}`;
            } else {
              displayTime = report.jamaat_time;
            }
          }

          return {
            id: el.id,
            osmId,
            name,
            lat: el.lat,
            lon: el.lon,
            distance: dist,
            distLabel: dist < 1 ? `${Math.round(dist * 1000)}m` : `${dist.toFixed(1)}km`,
            // Real data from Supabase (or null)
            hasReport: !!report,
            reportId: report?.id || null,
            jamaatTime: displayTime,
            upvotes: report?.upvotes ?? 0,
            downvotes: report?.downvotes ?? 0,
            timeAgo,
          };
        })
        .sort((a, b) => a.distance - b.distance);
    }

    // ===============================================================
    //  RENDER FEED CARDS
    // ===============================================================
    function renderFeed(mosques) {
      const list = document.getElementById('feed-list');
      const skeletons = document.getElementById('skeletons');
      if (skeletons) skeletons.remove();

      // Clear previous cards
      list.querySelectorAll('.mosque-card').forEach(c => c.remove());

      if (mosques.length === 0) {
        list.innerHTML = `
          <div class="text-center py-16 text-gray-400">
            <p class="text-4xl mb-3">🕌</p>
            <p class="font-semibold text-gray-500">No mosques found nearby</p>
            <p class="text-sm mt-1">Try enabling location access</p>
          </div>`;
        return;
      }

      mosques.forEach((m, i) => {
        const card = document.createElement('div');
        card.className = 'mosque-card bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden';
        card.setAttribute('data-index', i);

        // Build the time section
        let timeSection, voteSection;

        if (m.hasReport) {
          timeSection = `
            <div class="bg-gray-50 rounded-lg px-3 py-2 mb-3">
              <p class="text-sm font-semibold text-gray-700">
                🕐 <span class="text-emerald-800">${m.jamaatTime}</span>
              </p>
            </div>`;
          voteSection = `
            <div class="flex items-center gap-2">
              <button onclick="handleVote(this, 'correct', ${i})"
                      class="vote-btn flex items-center gap-1.5 border border-gray-200 rounded-lg px-3 py-1.5 text-xs font-semibold text-gray-600 bg-white hover:border-emerald-400">
                ✅ <span class="font-bengali">সঠিক</span> <span class="vote-count">${m.upvotes}</span>
              </button>
              <button onclick="handleVote(this, 'incorrect', ${i})"
                      class="vote-btn flex items-center gap-1.5 border border-gray-200 rounded-lg px-3 py-1.5 text-xs font-semibold text-gray-600 bg-white hover:border-red-400">
                ❌ <span class="font-bengali">ভুল</span> <span class="vote-count">${m.downvotes}</span>
              </button>
            </div>`;
        } else {
          timeSection = `
            <div class="bg-gray-50 rounded-lg px-3 py-2 mb-3">
              <p class="text-sm text-gray-400 italic">
                🕐 Not reported yet / এখনো রিপোর্ট হয়নি
              </p>
            </div>`;
          voteSection = ''; // No voting if no report
        }

        const metaLine = m.hasReport
          ? `<span>📍 ${m.distLabel}</span><span class="text-gray-200">•</span><span>${m.timeAgo}</span>`
          : `<span>📍 ${m.distLabel}</span>`;

        card.innerHTML = `
          <div class="p-4">
            <div class="flex items-start justify-between gap-3 mb-2.5">
              <div class="flex-1 min-w-0">
                <h3 class="font-bold text-gray-900 text-[15px] leading-snug truncate font-bengali">${escapeHtml(m.name)}</h3>
                <p class="text-xs text-gray-400 mt-0.5 flex items-center gap-1.5">
                  ${metaLine}
                </p>
              </div>
              ${m.hasReport ? `<span class="shrink-0 bg-emerald-50 text-emerald-700 text-xs font-bold px-2.5 py-1 rounded-lg border border-emerald-100">Reported</span>` : `<span class="shrink-0 bg-gray-50 text-gray-400 text-xs font-medium px-2.5 py-1 rounded-lg border border-gray-100">Pending</span>`}
            </div>
            ${timeSection}
            ${voteSection}
          </div>`;
        list.appendChild(card);
      });

      // Update stats
      const reportedCount = mosques.filter(m => m.hasReport).length;
      document.getElementById('stats-text').textContent = `${mosques.length} Mosques | ${reportedCount} Reported`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ===============================================================
    //  VOTING — Real Supabase updates with optimistic UI
    // ===============================================================
    async function handleVote(btn, type, index) {
      const mosque = state.mosques[index];
      if (!mosque || !mosque.hasReport || !mosque.reportId) {
        showToast('No report to vote on.', 'warning');
        return;
      }

      const parent = btn.parentElement;
      const allBtns = parent.querySelectorAll('.vote-btn');
      const isAlreadyVoted = btn.classList.contains('voted-correct') || btn.classList.contains('voted-incorrect');

      // Remove all vote classes first
      allBtns.forEach(b => b.classList.remove('voted-correct', 'voted-incorrect'));

      if (isAlreadyVoted) {
        // Un-vote: decrement
        if (type === 'correct') mosque.upvotes = Math.max(0, mosque.upvotes - 1);
        else mosque.downvotes = Math.max(0, mosque.downvotes - 1);
      } else {
        // Apply vote
        if (type === 'correct') {
          mosque.upvotes++;
          btn.classList.add('voted-correct');
        } else {
          mosque.downvotes++;
          btn.classList.add('voted-incorrect');
        }
      }

      // Optimistic UI update
      allBtns[0].querySelector('.vote-count').textContent = mosque.upvotes;
      allBtns[1].querySelector('.vote-count').textContent = mosque.downvotes;

      // Persist to Supabase in background
      if (!db) return;
      try {
        const { error } = await db
          .from('jamaat_reports')
          .update({
            upvotes: mosque.upvotes,
            downvotes: mosque.downvotes,
          })
          .eq('id', mosque.reportId);

        if (error) throw error;
      } catch (err) {
        console.error('Vote update failed:', err);
        showToast('Vote failed to save. Try again.', 'error');
      }
    }

    // ===============================================================
    //  LEAFLET MAP
    // ===============================================================
    function initMap(lat, lon, mosques) {
      if (state.map) {
        state.map.remove();
        state.map = null;
      }

      state.map = L.map('map-container', {
        zoomControl: false
      }).setView([lat, lon], 14);

      L.control.zoom({ position: 'bottomright' }).addTo(state.map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
      }).addTo(state.map);

      // User marker with pulse
      const userIcon = L.divIcon({
        className: '',
        html: '<div class="user-marker-pulse"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10],
      });
      L.marker([lat, lon], { icon: userIcon, zIndexOffset: 1000 })
        .addTo(state.map)
        .bindPopup('<div class="p-3 text-center"><strong class="text-emerald-700">📍 You are here</strong></div>');

      // Mosque markers
      const mosqueIcon = L.divIcon({
        className: '',
        html: `<div class="flex items-center justify-center w-8 h-8 bg-emerald-700 rounded-full shadow-lg border-2 border-white text-white text-sm">🕌</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });

      const unreportedIcon = L.divIcon({
        className: '',
        html: `<div class="flex items-center justify-center w-8 h-8 bg-gray-400 rounded-full shadow-lg border-2 border-white text-white text-sm">🕌</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });

      mosques.forEach((m) => {
        const icon = m.hasReport ? mosqueIcon : unreportedIcon;
        const marker = L.marker([m.lat, m.lon], { icon }).addTo(state.map);

        const popupTime = m.hasReport
          ? `<div class="bg-emerald-50 rounded-lg px-2.5 py-1.5 mb-2">
               <p class="text-xs font-semibold text-emerald-800">🕐 ${m.jamaatTime}</p>
             </div>
             <p class="text-[11px] text-gray-400">${m.timeAgo}</p>
             <div class="flex gap-2 mt-2 text-xs">
               <span class="text-emerald-600 font-medium">✅ ${m.upvotes}</span>
               <span class="text-red-500 font-medium">❌ ${m.downvotes}</span>
             </div>`
          : `<p class="text-xs text-gray-400 italic">Not reported yet</p>`;

        marker.bindPopup(`
          <div class="p-3.5">
            <h3 class="font-bold text-sm text-gray-900 mb-1" style="font-family: 'Noto Sans Bengali', sans-serif;">${escapeHtml(m.name)}</h3>
            <p class="text-xs text-gray-500 mb-2">📍 ${m.distLabel} away</p>
            ${popupTime}
          </div>
        `, { maxWidth: 260 });
      });
    }

    // ===============================================================
    //  VIEW TOGGLE
    // ===============================================================
    function setupViewToggle() {
      const btnFeed = document.getElementById('toggle-feed');
      const btnMap = document.getElementById('toggle-map');
      const feedView = document.getElementById('feed-view');
      const mapView = document.getElementById('map-view');

      function switchTo(view) {
        state.activeView = view;
        if (view === 'feed') {
          btnFeed.classList.add('active');
          btnMap.classList.remove('active');
          btnMap.classList.add('text-gray-500');
          btnFeed.classList.remove('text-gray-500');
          feedView.classList.remove('hidden');
          mapView.classList.add('hidden');
        } else {
          btnMap.classList.add('active');
          btnFeed.classList.remove('active');
          btnFeed.classList.add('text-gray-500');
          btnMap.classList.remove('text-gray-500');
          feedView.classList.add('hidden');
          mapView.classList.remove('hidden');
          setTimeout(() => {
            if (state.map) state.map.invalidateSize();
          }, 100);
        }
      }

      btnFeed.addEventListener('click', () => switchTo('feed'));
      btnMap.addEventListener('click', () => switchTo('map'));
    }

    // ===============================================================
    //  MODAL — Real Supabase submission
    // ===============================================================
    function setupModal() {
      const overlay = document.getElementById('modal-overlay');
      const btnOpen = document.getElementById('btn-add-time');
      const btnClose = document.getElementById('modal-close');
      const form = document.getElementById('report-form');
      const uploadArea = document.getElementById('upload-area');
      const fileInput = document.getElementById('modal-photo');
      const uploadLabel = document.getElementById('upload-label');
      const submitBtn = document.getElementById('submit-btn');
      const submitBtnText = document.getElementById('submit-btn-text');
      const submitBtnSpinner = document.getElementById('submit-btn-spinner');

      function openModal() {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        document.body.style.overflow = 'hidden';

        // Populate mosque select with OSM data
        const sel = document.getElementById('modal-mosque-select');
        sel.innerHTML = '<option value="">Select a mosque...</option>';
        state.mosques.forEach((m) => {
          const opt = document.createElement('option');
          // Store OSM ID and mosque name as value (pipe-delimited)
          opt.value = `${m.osmId}|${m.name}`;
          opt.textContent = `${m.name} (${m.distLabel})`;
          sel.appendChild(opt);
        });
      }

      function closeModal() {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        document.body.style.overflow = '';
        form.reset();
        uploadLabel.textContent = '📷 Tap to upload photo';
        setSubmitLoading(false);
      }

      function setSubmitLoading(loading) {
        submitBtn.disabled = loading;
        submitBtnText.textContent = loading ? 'Submitting...' : 'Submit Report / জমা দিন';
        submitBtnSpinner.classList.toggle('hidden', !loading);
        submitBtn.classList.toggle('opacity-70', loading);
        submitBtn.classList.toggle('cursor-not-allowed', loading);
      }

      btnOpen.addEventListener('click', openModal);
      btnClose.addEventListener('click', closeModal);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
      });

      // Upload area
      uploadArea.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
          uploadLabel.textContent = `📎 ${fileInput.files[0].name}`;
        }
      });

      // Form submit — insert into Supabase
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const mosqueValue = document.getElementById('modal-mosque-select').value;
        const time = document.getElementById('modal-time').value;

        if (!mosqueValue || !time) {
          showToast('Please select a mosque and time.', 'error');
          return;
        }

        // Parse the pipe-delimited value
        const [osmNodeId, mosqueName] = mosqueValue.split('|');

        setSubmitLoading(true);

        try {
          if (!db) throw new Error('Database not connected');
          const { data, error } = await db
            .from('jamaat_reports')
            .insert({
              osm_node_id: osmNodeId,
              mosque_name: mosqueName,
              jamaat_time: time,
              upvotes: 0,
              downvotes: 0,
            })
            .select();

          if (error) throw error;

          showToast('Time added successfully! সময় যোগ হয়েছে! ✅', 'success');
          closeModal();

          // Refresh data to show the new report
          await refreshData();

        } catch (err) {
          console.error('Supabase insert failed:', err);
          showToast('Failed to submit. Please try again. / জমা ব্যর্থ হয়েছে।', 'error');
          setSubmitLoading(false);
        }
      });
    }

    // ===============================================================
    //  REFRESH DATA — Re-fetch Supabase and re-render
    // ===============================================================
    async function refreshData() {
      const reports = await fetchReportsFromSupabase();
      state.reports = reports;
      state.mosques = mergeDataAndProcess(state.rawOsmElements, reports, state.userLat, state.userLon);
      renderFeed(state.mosques);
      initMap(state.userLat, state.userLon, state.mosques);
    }

    // ===============================================================
    //  INITIALIZATION
    // ===============================================================
    async function init() {
      const loadingScreen = document.getElementById('loading-screen');
      const app = document.getElementById('app');

      try {
        // Step 1: Get user location
        const loc = await getUserLocation();
        state.userLat = loc.lat;
        state.userLon = loc.lon;
        state.usingDefault = loc.fallback;

        const loadingText = document.getElementById('loading-text');
        if (loadingText) loadingText.textContent = 'Fetching mosque data...';

        // Step 2: Fetch OSM mosques AND Supabase reports in parallel
        const [rawOsmElements, reports] = await Promise.all([
          fetchMosquesFromOSM(loc.lat, loc.lon),
          fetchReportsFromSupabase(),
        ]);

        // Store raw OSM data for future refreshes
        state.rawOsmElements = rawOsmElements;
        state.reports = reports;

        if (loadingText) loadingText.textContent = 'Merging data...';

        // Step 3: Merge OSM + Supabase data
        state.mosques = mergeDataAndProcess(rawOsmElements, reports, loc.lat, loc.lon);

        // Step 4: Render
        renderFeed(state.mosques);
        initMap(loc.lat, loc.lon, state.mosques);

        // Step 5: Setup interactivity
        setupViewToggle();
        setupModal();

        // Step 7: Show fallback toast
        if (loc.fallback) {
          setTimeout(() => {
            showToast('Showing default area. Enable location for nearby results.', 'warning');
          }, 800);
        }

      } catch (err) {
        console.error('Init failed:', err);
        showToast('Something went wrong. Please refresh.', 'error');
        // Still setup basic interactivity if possible
        try { setupViewToggle(); } catch(e) {}
        try { setupModal(); } catch(e) {}
      } finally {
        // ALWAYS dismiss loading screen, no matter what
        loadingScreen.classList.add('hide');
        app.classList.remove('opacity-0');
        app.classList.add('opacity-100');
        setTimeout(() => loadingScreen.remove(), 600);
      }
    }

    // Start
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
